# Fedora prepends the ccache wrappers (gcc, g++, cc, c++, and cross compilers
# such as aarch64-linux-gnu-gcc) from /etc/profile.d/ccache.sh. That file is
# POSIX-shell only, so fish and the systemd user manager never read it. Put the
# directory first for services started by the user manager as well.
PATH=/usr/lib64/ccache:${PATH:-/usr/local/bin:/usr/bin:/bin}
